  <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b6785d"/></marker>
  <clipPath id="sheet"><rect width="1230" height="425" rx="17"/></clipPath>
</defs>
