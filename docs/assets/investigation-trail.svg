<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 425" role="img" aria-labelledby="title desc">
<title id="title">GraphGuard — the investigator evidence trail</title>
<desc id="desc">A conceptual five-stage investigation flow connecting event intake, graph construction, XGBoost scoring, SHAP explainability and reviewer interface. It represents modules and intent, not verified end-to-end production operation.</desc>
<defs>
