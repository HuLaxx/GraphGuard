[project]
name = "graphguard-ml"
version = "1.0.0"
description = "GraphGuard ML Training and Serving"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "pydantic>=2.5.0",
    "uvicorn>=0.24.0",
    "strawberry-graphql[fastapi]>=0.216.0",
    "redis>=5.0.0",
    "torch>=2.1.2",
    "torch-geometric>=2.4.0",
    "dgl>=1.1.3",
    "xgboost>=2.0.3",
    "scikit-learn>=1.3.2",
    "shap>=0.44.0",
    "lime>=0.2.0.1",
    "imbalanced-learn>=0.11.0",
    "ray[default]>=2.7.1",
    "optuna>=3.5.0",
    "mlflow>=2.8.1",
    "evidently>=0.4.11",
    "feast[redis]>=0.35.0",
    "prometheus-client>=0.19.0",
    "pandas>=2.1.4",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "structlog>=23.2.0",
    "httpx>=0.27.0",
    "sentence-transformers>=2.6.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
