# Isolated, disposable P1 integration services; NOT a production deployment.
# No host mounts or durable volumes. Never point this at real customer data.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 15s

  neo4j:
    image: neo4j:5.13-community
    ports:
      - "127.0.0.1:7687:7687"
    environment:
      # Local CI fixture credential only. No production account or external exposure.
      NEO4J_AUTH: "neo4j/graphguard-integration-only"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphguard-integration-only 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 15s
