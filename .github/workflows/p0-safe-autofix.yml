name: P0 Safe Autofix (feature branch only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-safe-autofix.yml'

permissions:
  contents: write

jobs:
  safe-autofix:
    if: github.event.pull_request.head.ref == 'audit/p0-ci-evidence-2026-11-12' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the review branch, never main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Apply only ESLint safe autofixes
        run: |
          cd frontend
          npx eslint . --fix || true
      - name: Commit changes to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            echo "No auto-fix changes"
          else
            git commit -m "style(p0): apply safe frontend ESLint autofixes"
            git push origin HEAD:audit/p0-ci-evidence-2026-11-12
          fi
      - name: Report remaining blockers, separate CI stays strict
        run: |
          npm --prefix frontend run lint || true
          echo "This autofix workflow is not a release quality gate; CI lint is authoritative."
