name: Project guide (RAG assistant)

on:
  pull_request:
    paths:
      - "frontend/project-guide/**"
      - "frontend/src/lib/project-guide/**"
      - "frontend/src/components/project-guide/**"
      - "frontend/src/app/api/project-guide/**"
      - "frontend/e2e/project-guide.spec.ts"
      - ".github/workflows/project-guide.yml"
  push:
    branches: [main]
    paths:
      - "frontend/project-guide/**"
      - "frontend/src/lib/project-guide/**"
      - "frontend/src/components/project-guide/**"
      - "frontend/src/app/api/project-guide/**"
      - ".github/workflows/project-guide.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval:
    name: Unit tests, index freshness and retrieval eval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit tests (node:test, native TypeScript)
        run: node --test project-guide/tests/core.check.ts
      - name: Committed index matches the corpus
        run: node project-guide/scripts/build-index.ts --check
      - name: Retrieval evaluation gate
        run: |
          node project-guide/scripts/eval.ts --json project-guide-eval.json \
            --min-hit5 0.9 --min-refusal 0.6 --max-false-refusal 0.05 | tee eval.txt
          {
            echo "### Project guide retrieval eval"
            echo '```'
            cat eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Type-check core, scripts and tests
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/tsc" typescript@5.9 @types/node@24
          "$RUNNER_TEMP/tsc/node_modules/.bin/tsc" -p project-guide/tsconfig.json --typeRoots "$RUNNER_TEMP/tsc/node_modules/@types"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-guide-eval
          path: frontend/project-guide-eval.json
          retention-days: 30

  browser:
    name: Browser end-to-end (Chromium, real route handler)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Add Playwright test runner (not a GraphGuard dependency)
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.57.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run project guide e2e
        run: npx playwright test --config playwright.project-guide.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: project-guide-playwright
          path: frontend/test-results/
          retention-days: 7
