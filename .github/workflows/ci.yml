name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, 'audit/**', 'feature/**']

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Type-check frontend
        run: npm --prefix frontend run type-check

      - name: Build real Next.js frontend
        run: npm --prefix frontend run build

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Run tests
        run: npm --prefix frontend run test

  test-backend:
    name: Test Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install test dependencies
        run: |
          pip install -r requirements-ci.txt
          
      - name: Run pytest
        run: |
          pytest tests/unit/test_rag.py tests/unit/test_graph_builder_delivery.py tests/unit/test_transaction_ledger.py tests/unit/test_point_in_time_features.py -v

  security:
    name: High / Critical Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source and dependency manifests
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  build-docker:
    name: Build Existing MLflow Image
    runs-on: ubuntu-latest
    needs: [lint, test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build MLflow image
        uses: docker/build-push-action@v5
        with:
          context: ./infrastructure/mlflow
          push: false
          tags: graphguard/mlflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ingestion-integration:
    name: Real Kafka / Neo4j ingestion integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install integration test dependencies
        run: |
          pip install -r requirements-ci.txt -r requirements-ingestion-ci.txt -r requirements-review-ci.txt
      - name: Start disposable broker and graph database
        run: docker compose -f docker-compose.ingestion.yml up -d --wait
      - name: Test JSON and Avro with real services, PIT features and verified model scoring
        env:
          GRAPHGUARD_INGESTION_INTEGRATION: "1"
        run: pytest tests/integration/test_ingest_kafka_neo4j.py tests/integration/test_avro_registry.py -v
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.ingestion.yml logs --no-color --tail=150
      - name: Tear down disposable services
        if: always()
        run: docker compose -f docker-compose.ingestion.yml down --remove-orphans

  ml-baselines:
    name: Synthetic point-in-time ML baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only baseline dependencies
        run: python -m pip install -r requirements-review-ci.txt
      - name: Test ML, verified SHAP and signed human-review audit
        run: python -m pytest tests/unit/test_pit_baselines.py tests/unit/test_verified_pit_scorer.py tests/unit/test_verified_shap.py tests/unit/test_synthetic_review.py -v
      - name: Train both models and generate inspectable synthetic metrics
        run: python -m ml.training.pit_baselines --count 720 --seed 42 --output-dir .local/ml-baselines
      - name: Upload synthetic-only report and model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graphguard-pit-ml-synthetic-baselines
          path: |
            .local/ml-baselines/manifest.json
            .local/ml-baselines/synthetic_records.jsonl
            .local/ml-baselines/logistic_baseline.json
            .local/ml-baselines/xgboost_baseline.json
          if-no-files-found: error
          retention-days: 14

  local-review-http-smoke:
    name: Signed local case dashboard HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install local-review backend dependencies
        run: python -m pip install -r requirements-review-ci.txt
      - name: Install Next.js frontend dependencies
        run: npm --prefix frontend ci
      - name: Start real loopback Next + Python API and verify synthetic case/SHAP/review
        run: python -m ml.review.run_local_demo --workspace .local/graphguard-http-smoke --smoke
      - name: Show sanitized local service failure logs
        if: failure()
        run: |
          echo "Review smoke failed. The runner never logs tokens or signing keys."
          echo "Inspect the failing process output above. Avoid publishing .local artifacts."

  npm-audit-inventory:
    name: npm full / production advisory inventory
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture explicit full and production npm advisory reports
        run: |
          mkdir -p .local/security
          npm --prefix frontend audit --json > .local/security/npm-full.json || true
          npm --prefix frontend audit --omit=dev --json > .local/security/npm-production.json || true
      - name: Print traceable advisory package, installed ranges and safe fix hints
        run: |
          node scripts/print-npm-audit.mjs .local/security/npm-full.json full
          node scripts/print-npm-audit.mjs .local/security/npm-production.json production
      - name: Block production high and critical npm advisories
        run: npm --prefix frontend audit --omit=dev --audit-level=high
      - name: Upload inspectable npm audit JSON reports
        uses: actions/upload-artifact@v4
        with:
          name: graphguard-npm-audit-2026-11-17
          path: |
            .local/security/npm-full.json
            .local/security/npm-production.json
          retention-days: 7
          if-no-files-found: error

  npm-security-candidate:
    name: P0 npm remediation trial (non-mutating)
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/graphguard-p0-npm-security-audit-2026-11-17'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare controlled dependency candidate without committing
        run: node scripts/prepare-npm-security-candidate.mjs
      - name: Resolve pinned lock and apply only semver-safe transitive patches
        run: |
          npm --prefix frontend install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm --prefix frontend audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm --prefix frontend ci
      - name: Verify candidate lint, types, frontend tests and Next build
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run type-check
          npm --prefix frontend run test
          npm --prefix frontend run build
      - name: Audit candidate full and production lockfiles
        if: always()
        run: |
          npm --prefix frontend audit --json > .local/security/candidate-full.json || true
          npm --prefix frontend audit --omit=dev --json > .local/security/candidate-production.json || true
          node scripts/print-npm-audit.mjs .local/security/candidate-full.json candidate-full
          node scripts/print-npm-audit.mjs .local/security/candidate-production.json candidate-production
      - name: Emit inspectable changed dependency tree for manual PR updates
        if: always()
        run: node scripts/print-npm-security-patch.mjs
      - name: Upload proposal reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphguard-npm-proposal
          path: |
            .local/security/candidate-full.json
            .local/security/candidate-production.json
            frontend/package-lock.json
            frontend/package.json
          if-no-files-found: warn
          retention-days: 7
