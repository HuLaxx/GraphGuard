name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, 'audit/**', 'feature/**']

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Type-check frontend
        run: npm --prefix frontend run type-check

      - name: Build real Next.js frontend
        run: npm --prefix frontend run build

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Run tests
        run: npm --prefix frontend run test

  test-backend:
    name: Test Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install test dependencies
        run: |
          pip install -r requirements-ci.txt
          
      - name: Run pytest
        run: |
          pytest tests/unit/test_rag.py tests/unit/test_graph_builder_delivery.py tests/unit/test_transaction_ledger.py -v

  security:
    name: High / Critical Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source and dependency manifests
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  build-docker:
    name: Build Existing MLflow Image
    runs-on: ubuntu-latest
    needs: [lint, test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build MLflow image
        uses: docker/build-push-action@v5
        with:
          context: ./infrastructure/mlflow
          push: false
          tags: graphguard/mlflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ingestion-integration:
    name: Real Kafka / Neo4j ingestion integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install integration test dependencies
        run: |
          pip install -r requirements-ci.txt -r requirements-ingestion-ci.txt
      - name: Start disposable broker and graph database
        run: docker compose -f docker-compose.ingestion.yml up -d --wait
      - name: Test duplicate, conflict and replay with real services
        env:
          GRAPHGUARD_INGESTION_INTEGRATION: "1"
        run: pytest tests/integration/test_ingest_kafka_neo4j.py -v
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.ingestion.yml logs --no-color --tail=150
      - name: Tear down disposable services
        if: always()
        run: docker compose -f docker-compose.ingestion.yml down --remove-orphans
